dos.\n7. Móveis e equipamentos: não saem do espaço. Mudança de lugar só com combinação, e tudo volta ao lugar de origem.\n8. Piscina (se houver): uso por conta e risco do contratante; crianças sempre acompanhadas por adulto; sem copos de vidro na área da piscina.\n9. Fornecedores: buffet, decoração, som e demais fornecedores do contratante seguem estas regras. O contratante responde pelos danos que eles causarem.\n10. Limpeza e lixo: lixo ensacado e deixado no local indicado. Limpeza fora do normal ou retirada de decoração deixada para trás podem ser descontadas da caução.\n11. Danos e faltas: danos, itens quebrados e faltas apurados na vistoria final, comparada com a vistoria prévia, podem ser descontados da caução. Se passarem do valor da caução, a diferença é cobrada do contratante.\n12. Caução: devolvida em até {prazo} dias úteis após o fim do uso do espaço, descontado o que for apurado na vistoria final.\n13. Objetos esquecidos ficam guardados por 30 dias.",ts="CLÁUSULA 1 – OBJETO. O LOCADOR cede ao LOCATÁRIO, em caráter temporário, o uso do espaço {espaco}, situado em {endereco}, para a realização de {tipo} em {data_evento}. Trata-se de locação não residencial e temporária, que se destina só a esse evento; a finalidade não pode ser alterada sem acordo por escrito. O espaço é composto por: {descricao}.\nCLÁUSULA 2 – NÚMERO DE CONVIDADOS. O número máximo de convidados é {convidados}, respeitada a lotação máxima autorizada de {lotacao} pessoas. Convidados a mais só com combinação prévia por escrito, ao preço de {valor_pessoa_extra} por pessoa. Convidados acima do máximo sem essa combinação geram multa de {multa_pessoa} por pessoa a mais, e o LOCADOR pode impedir a entrada de pessoas acima do máximo ou da lotação autorizada pelo Corpo de Bombeiros, por segurança.\nCLÁUSULA 3 – O QUE ESTÁ INCLUÍDO. Estão incluídos na locação do espaço:\n{itens_inclusos}\nOs serviços incluídos podem ser prestados por empresa contratada pelo LOCADOR.{anexo_equipe} Não estão incluídos: {nao_inclusos}, nem qualquer serviço não listado nesta cláusula.\nCLÁUSULA 4 – HORÁRIOS. O LOCATÁRIO tem o uso do espaço de {uso_inicio} até {uso_fim}, período que inclui a montagem, o evento, a desmontagem e a entrega do espaço. O evento acontece das {inicio} às {fim}. Decoração, móveis, equipamentos e materiais do LOCATÁRIO e dos fornecedores dele devem ser retirados até {uso_fim}, quando o espaço é entregue ao LOCADOR. Uso fora desse período só com combinação prévia por escrito.\nCLÁUSULA 5 – PREÇO E PAGAMENTO. Pela locação, o LOCATÁRIO paga {valor} ({valor_extenso}). {clausula_pagamento} Os pagamentos são feitos por {dados_pagamento}, e cada pagamento recebe recibo do LOCADOR. O atraso gera multa de {multa_atraso}% e juros de 1% ao mês, proporcionais aos dias, sobre o valor em atraso.\nCLÁUSULA 6 – CAUÇÃO. O LOCATÁRIO entrega caução de {caucao}, devolvida em até {prazo} dias úteis após a entrega do espaço, descontados os danos apurados conforme a Cláusula 8, as despesas e as multas deste contrato. Se esses valores passarem da caução, a diferença é paga pelo LOCATÁRIO em até 10 dias da comunicação, acompanhada das fotos das vistorias e do orçamento.\nCLÁUSULA 7 – VISTORIAS. Antes da montagem e depois da desmontagem são feitas vistorias com fotos, data e hora (vistoria prévia e vistoria final), que passam a fazer parte deste contrato. A vistoria pode ser feita pelo LOCADOR ou por funcionário dele, com o LOCATÁRIO ou pessoa indicada por ele, que pode registrar ressalvas. O LOCATÁRIO recebe o espaço no estado registrado na vistoria prévia e deve devolvê-lo no mesmo estado.\nCLÁUSULA 8 – DANOS. O LOCATÁRIO responde pelos danos causados por ele, pelos convidados e pelos fornecedores que contratar, desde que comprovados: o dano, pela comparação das fotos da vistoria prévia e da vistoria final; a ligação do dano com o evento; e o valor, por orçamento do conserto ou da reposição com a mesma qualidade. O que já estava registrado na vistoria prévia não é cobrado, nem o desgaste normal de uso.\nCLÁUSULA 9 – OBRIGAÇÕES DO LOCATÁRIO. O LOCATÁRIO se obriga a: I – contratar, por sua conta, toda a estrutura do evento não incluída na Cláusula 3, como buffet, iluminação cênica, sonorização, manobristas e segurança, sem responsabilidade do LOCADOR por serviços que não estejam neste contrato; II – usar o espaço só para o evento contratado e cumprir as regras do espaço, que fazem parte deste contrato; III – manter o espaço em bom estado de conservação, higiene e limpeza durante o uso; IV – respeitar a lei de silêncio e as demais normas do município.\nCLÁUSULA 10 – FORNECEDORES DO LOCATÁRIO. O LOCATÁRIO deve combinar antes com os fornecedores que contratar que: I – os equipamentos elétricos sejam compatíveis com os quadros e as tomadas do espaço; II – a decoração e as estruturas tenham sustentação própria, sem pregos, grampos, fitas adesivas ou qualquer material que danifique paredes, teto, piso, estruturas ou instalações; III – estruturas ou equipamentos pendurados na estrutura do espaço, e qualquer adaptação interna ou externa, só sejam montados com Anotação de Responsabilidade Técnica (ART) e laudo técnico assinados por profissional habilitado, entregues ao LOCADOR antes da montagem; IV – as equipes usem uniforme ou traje de trabalho, circulem só nas áreas do evento e nas áreas de serviço indicadas pelo LOCADOR e mantenham conduta respeitosa. Se houver descumprimento, o LOCADOR comunica o LOCATÁRIO, ou o responsável indicado por ele, e exige a correção; só interrompe a montagem, o uso ou a conduta na hora em caso de risco a pessoas ou ao imóvel.\nCLÁUSULA 11 – OBRIGAÇÕES DO LOCADOR. Entregar o espaço limpo, no dia e no horário combinados, com os itens e as instalações registrados na vistoria prévia em funcionamento e com os serviços da Cláusula 3.\nCLÁUSULA 12 – CHUVA E CLIMA. {chuva}\nCLÁUSULA 13 – GERADOR. {gerador}\nCLÁUSULA 14 – MULTAS ESPECÍFICAS. I – Fogos: é proibido usar, nas dependências do espaço, fogos de artifício, sinalizadores, chuvas de prata ou de faíscas, máquinas de fogo e qualquer outro material pirotécnico ou explosivo. O uso leva à interrupção imediata, à multa de {multa_fogos} e ao ressarcimento dos danos. II – Desocupação: se o espaço não for entregue até {uso_fim}, com tolerância de {tolerancia}, o LOCATÁRIO paga multa de {multa_desocupacao} por dia ou fração, até a retirada de todo o material. As multas podem ser descontadas da caução ou pagas em até 10 dias da comunicação.\nCLÁUSULA 15 – DESISTÊNCIA DO LOCATÁRIO. A desistência deve ser comunicada por escrito. O LOCATÁRIO perde em favor do LOCADOR um percentual do valor deste contrato, conforme a antecedência do aviso em relação à data do evento:\nI – aviso com mais de 12 meses de antecedência: perde {desist_1}%{desist_1_valor};\nII – aviso de mais de 6 até 12 meses antes: perde {desist_2}%{desist_2_valor};\nIII – aviso de mais de 3 até 6 meses antes: perde {desist_3}%{desist_3_valor};\nIV – aviso de 30 dias até 3 meses antes: perde {desist_4}%{desist_4_valor};\nV – aviso com menos de 30 dias de antecedência: perde {desist_5}%{desist_5_valor}.\nO que o LOCATÁRIO tiver pago além desse percentual é devolvido em até {devolucao_dias} dias úteis, sem correção. Se tiver pago menos, a diferença é devida no mesmo prazo. Em vez de desistir, o LOCATÁRIO pode remarcar a data uma vez, sem multa, para data livre na agenda, com aviso de pelo menos {remarc_aviso} dias antes do evento.\nCLÁUSULA 16 – CANCELAMENTO PELO LOCADOR. Se o LOCADOR cancelar a locação fora dos casos da Cláusula 18, devolve tudo o que recebeu e paga ao LOCATÁRIO multa de {multa_locador}% do valor deste contrato, em até {devolucao_dias} dias úteis.\nCLÁUSULA 17 – TRANSFERÊNCIA. O LOCATÁRIO pode transferir a data a outra pessoa, com concordância por escrito do LOCADOR. A nova pessoa assina este contrato e assume todas as obrigações dele.\nCLÁUSULA 18 – FORÇA MAIOR E IMPEDIMENTO POR AUTORIDADE. Nenhuma das partes responde por prejuízos de caso fortuito ou força maior, assim entendido o fato necessário, imprevisível ou inevitável, cujos efeitos não era possível evitar ou impedir (artigo 393 do Código Civil). Se o evento for impedido sem culpa das partes, inclusive por interdição ou proibição de autoridade, a data é remarcada sem multa, para data livre na agenda dentro de {forca_meses} meses. Não havendo data possível, o LOCADOR devolve os valores pagos em até {forca_dias} dias, descontadas as despesas já feitas e comprovadas por ele.\nCLÁUSULA 19 – LIMITES DA RESPONSABILIDADE DO LOCADOR. Salvo culpa do LOCADOR ou de sua equipe, ele não responde: I – pela organização do evento e pela disposição dos convidados, que são do LOCATÁRIO; II – por danos causados no transporte, na montagem e na desmontagem feitos pelos fornecedores do LOCATÁRIO, ou pelos produtos e serviços que eles usarem no evento; III – por furto ou roubo de bens trazidos pelo LOCATÁRIO, pelos convidados ou pelos fornecedores; IV – pelas condições do trânsito e do acesso ao espaço.\nCLÁUSULA 20 – COBRANÇA. Se o LOCADOR precisar cobrar judicialmente valores deste contrato, o LOCATÁRIO paga honorários advocatícios de {honorarios}% sobre o débito apurado, além das custas judiciais e extrajudiciais.\nCLÁUSULA 21 – DADOS PESSOAIS. CPF, RG, endereço, contatos e dados bancários que constam deste contrato são usados só para a reserva, o contrato, as vistorias, os pagamentos e as devoluções, conforme a Lei 13.709/2018 (LGPD). Ficam guardados por {lgpd_anos} anos após o fim do contrato, prazo para eventuais cobranças e obrigações legais, e depois são apagados.\nCLÁUSULA 22 – ASSINATURA ELETRÔNICA. As partes aceitam como válida entre elas a assinatura eletrônica deste contrato feita na tela do celular (artigo 10, § 2º, da Medida Provisória 2.200-2/2001).\nCLÁUSULA 23 – DISPOSIÇÕES GERAIS. As partes declaram estar no pleno gozo de seus direitos civis e assinar sem coação. Ressalvadas as Cláusulas 15 a 18, este contrato é irrevogável e irretratável e obriga as partes, seus herdeiros e sucessores. A tolerância de uma parte com qualquer descumprimento é mera liberalidade e não altera o contrato. As regras do espaço, as vistorias e o anexo fazem parte deste contrato.\nCLÁUSULA 24 – OBSERVAÇÕES. {observacoes}\nCLÁUSULA 25 – FORO. Fica eleito o foro da comarca de {comarca} para resolver as questões deste contrato.",ss={pixT:"CPF",pix:"",banco:"",ag:"",conta:"",benef:"",lnac:"",lrg:"",lend:"",desc:"",incl:"",serv:"",nao:"serviço de manobristas",pex:"",pagto:"",chuva:"",tendas:"loc",ger:"",gAuto:"",gOp:"",gPot:"",gHora:"",gConc:"",gMin:"",equipe:"",obs:"",atraso:"2",desoc:"1.000,00",tolH:"1",fogos:"1.000,00",locM:"10",honor:"20",d1:"20",d2:"50",d3:"60",d4:"70",d5:"85",devD:"10",remAv:"90",foro:"",fMes:"12",fDias:"30",lgpd:"5"},ns=a=>Object.assign({},ss,a&&a.cm||{});function is(a){const e=!(!o||!a||"completo"!==a.ctrModelo);return{ctrM:e?"completo":"simples",ctr:e?a&&a.contratoC||ts:a&&a.contrato||(o?$s:xs),cm:e?ns(a):void 0}}const rs=a=>{const e=Va(a);return e>0?Ua(e):""};function ds(a){const e=String(a.chuva||"").trim();return(e?"Em caso de chuva ou mau tempo, "+e.replace(/\.$/,"")+".":"O espaço não oferece área coberta alternativa além das descritas na Cláusula 1.")+" "+("dono"===a.tendas?"Tendas ou estruturas extras necessárias por causa do clima são providenciadas pelo LOCADOR, sem custo adicional.":"Tendas ou estruturas extras, se o LOCATÁRIO quiser, são contratadas e pagas por ele, com montagem combinada com o LOCADOR.")}function cs(a){if("sim"!==a.ger)return"O espaço não dispõe de gerador de energia.";const e=rs(a.gHora),o=parseFloat(a.gMin)||0;return`O espaço dispõe de gerador de energia${a.gPot?" ("+String(a.gPot).trim().replace(/\.$/,"")+")":""}. O gerador ${"sim"===a.gAuto?"liga sozinho":"é ligado manualmente"} quando falta energia, ${"sim"===a.gOp?"com operador do LOCADOR":"sem operador incluído"}. ${e?"O uso custa "+e+" por hora"+(o?", com cobrança mínima de "+o+" hora"+(o>1?"s":""):"")+".":"O uso não é cobrado à parte."}`}function ls(a,e){c  devolvida em até {prazo} dias úteis após o fim do uso do espaço, descontados os danos, as faltas e as despesas apurados na vistoria final, comparada com a vistoria prévia. Se esses valores passarem da caução, a diferença é paga pelo LOCATÁRIO em até 10 dias da comunicação, acompanhada das fotos das vistorias e do orçamento.\nCLÁUSULA 6 – VISTORIAS. Antes da montagem e depois da desmontagem são feitas vistorias com fotos, data e hora (vistoria prévia e vistoria final), que passam a fazer parte deste contrato. A vistoria pode ser feita pelo LOCADOR ou por funcionário dele, com o LOCATÁRIO ou pessoa indicada por ele, que pode registrar ressalvas. O LOCATÁRIO recebe o espaço no estado registrado na vistoria prévia e deve devolvê-lo no mesmo estado.\nCLÁUSULA 7 – OBRIGAÇÕES DO LOCATÁRIO. Usar o espaço só para o evento contratado; cumprir as regras do espaço, que fazem parte deste contrato; responder pelos atos de convidados e dos fornecedores que contratar; respeitar a lei de silêncio e as demais normas do município; devolver o espaço nas condições em que recebeu.\nCLÁUSULA 8 – OBRIGAÇÕES DO LOCADOR. Entregar o espaço limpo, no dia e no horário combinados, com os itens e equipamentos da vistoria prévia em funcionamento.\nCLÁUSULA 9 – DESISTÊNCIA DO LOCATÁRIO. Se o LOCATÁRIO desistir do evento, perde o sinal em favor do LOCADOR (artigo 418 do Código Civil). Os valores pagos além do sinal são devolvidos em até 10 dias. Com aviso de pelo menos 30 dias antes do evento, a data pode ser remarcada uma vez, sem custo, para data livre na agenda nos 6 meses seguintes.\nCLÁUSULA 10 – CANCELAMENTO PELO LOCADOR. Se o LOCADOR cancelar a locação, devolve o que recebeu e paga ao LOCATÁRIO valor igual ao do sinal (sinal em dobro, artigo 418 do Código Civil), salvo caso fortuito ou força maior.\nCLÁUSULA 11 – CASO FORTUITO OU FORÇA MAIOR. Interdição do espaço por autoridade, calamidade ou outro fato que impeça o evento sem culpa das partes permite remarcar a data sem multa ou, não havendo data possível, devolver os valores pagos, descontadas as despesas já feitas e comprovadas por ele.\nCLÁUSULA 12 – DADOS PESSOAIS. Os dados do LOCATÁRIO são usados só para este contrato, para a reserva e para as vistorias, conforme a Lei 13.709/2018 (LGPD).\nCLÁUSULA 13 – ASSINATURA ELETRÔNICA. As partes aceitam como válida entre elas a assinatura eletrônica deste contrato feita na tela do celular (artigo 10, § 2º, da Medida Provisória 2.200-2/2001).\nCLÁUSULA 14 – FORO. Fica eleito o foro da comarca de {cidade} para resolver as questões deste contrato.",ws="{espaco} {endereco} {tipo} {data_evento} {inicio} {fim} {convidados} {lotacao} {uso_inicio} {uso_fim} {valor} {valor_extenso} {pagamento} {caucao} {prazo} {cidade}",xs="CLÁUSULA 1 – OBJETO. O LOCADOR dá em locação para temporada ao LOCATÁRIO o imóvel {imovel}, situado em {endereco}, mobiliado e equipado conforme a vistoria de entrada, destinado só à residência temporária do LOCATÁRIO e de seus acompanhantes, nos termos dos artigos 48 a 50 da Lei 8.245/1991 (Lei do Inquilinato).\nCLÁUSULA 2 – PRAZO. A locação vai de {checkin} (check-in) até {checkout} (check-out), num total de {noites} noite(s), prazo menor que 90 dias. No horário do check-out, o LOCATÁRIO devolve o imóvel livre de pessoas e de bens. Ficar além desse horário só com combinação prévia com o LOCADOR, que pode cobrar pelo período extra.\nCLÁUSULA 3 – OCUPAÇÃO. O imóvel será ocupado por até {hospedes} pessoa(s), sem passar do máximo de {maxhosp} hóspedes do imóvel. Pernoite de pessoas não informadas e visitas dependem de autorização do LOCADOR.\nCLÁUSULA 4 – PREÇO E PAGAMENTO. Pela locação, o LOCATÁRIO paga {valor} ({valor_extenso}), da seguinte forma: {pagamento}. O aluguel pode ser cobrado antecipadamente, de uma só vez (artigo 49 da Lei 8.245/1991). Se o preço não estiver pago até o check-in, o LOCADOR pode deixar de entregar o imóvel.\nCLÁUSULA 5 – SINAL. O primeiro pagamento vale como sinal e confirma a reserva (arras confirmatórias, artigos 417 a 420 do Código Civil). Até o pagamento do sinal, as datas ficam apenas pré-reservadas.\nCLÁUSULA 6 – CAUÇÃO. O LOCATÁRIO entrega caução de {caucao}, devolvida em até {prazo} dias úteis após o check-out, descontados os danos, as faltas e as despesas apurados na vistoria de saída, comparada com a vistoria de entrada. Se esses valores passarem da caução, a diferença é paga pelo LOCATÁRIO em até 10 dias da comunicação, com as fotos das vistorias.\nCLÁUSULA 7 – VISTORIAS. No check-in e no check-out são feitas vistorias com fotos, data e hora (vistoria de entrada e vistoria de saída), que passam a fazer parte deste contrato. A vistoria pode ser feita pelo LOCADOR ou por pessoa indicada por ele, com o LOCATÁRIO ou pessoa indicada por ele. O que estiver registrado na vistoria de entrada não pode ser cobrado do LOCATÁRIO.\nCLÁUSULA 8 – OBRIGAÇÕES DO LOCATÁRIO. Usar o imóvel só como residência temporária; cumprir as regras da casa e o regulamento do condomínio, que fazem parte deste contrato; responder pelos atos dos acompanhantes e visitantes; respeitar a lei de silêncio; devolver o imóvel, os móveis e os utensílios nas condições em que recebeu, salvo o desgaste natural do uso; devolver chaves, controles e cartões de acesso no check-out.\nCLÁUSULA 9 – OBRIGAÇÕES DO LOCADOR. Entregar o imóvel limpo, no dia e no horário do check-in, com os itens e equipamentos da vistoria de entrada em funcionamento, e informar as regras do condomínio que o LOCATÁRIO deve seguir.\nCLÁUSULA 10 – PROIBIÇÕES. É proibido sublocar, ceder ou emprestar o imóvel, no todo ou em parte, e fazer festas ou eventos sem autorização por escrito do LOCADOR.\nCLÁUSULA 11 – DESISTÊNCIA DO LOCATÁRIO. Se o LOCATÁRIO desistir da locação, perde o sinal em favor do LOCADOR (artigo 418 do Código Civil). Os valores pagos além do sinal são devolvidos em até 10 dias.\nCLÁUSULA 12 – CANCELAMENTO PELO LOCADOR. Se o LOCADOR cancelar a locação, devolve o que recebeu e paga ao LOCATÁRIO valor igual ao do sinal (sinal em dobro, artigo 418 do Código Civil), salvo caso fortuito ou força maior.\nCLÁUSULA 13 – CASO FORTUITO OU FORÇA MAIOR. Interdição do imóvel por autoridade, calamidade ou outro fato que impeça a locação sem culpa das partes permite remarcar as datas sem multa ou, não havendo data possível, devolver os valores pagos.\nCLÁUSULA 14 – DADOS PESSOAIS. Os dados do LOCATÁRIO são usados só para este contrato, para a reserva, para as vistorias e para o cadastro de hóspedes exigido pelo condomínio, conforme a Lei 13.709/2018 (LGPD).\nCLÁUSULA 15 – ASSINATURA ELETRÔNICA. As partes aceitam como válida entre elas a assinatura eletrônica deste contrato feita na tela do celular (artigo 10, § 2º, da Medida Provisória 2.200-2/2001).\nCLÁUSULA 16 – FORO. Fica eleito o foro da comarca de {cidade} para resolver as questões deste contrato.",ys="1. Check-in e check-out: nos horários desta reserva. Entrada antecipada ou saída depois do horário só com combinação prévia.\n2. Hóspedes: só as pessoas informadas na reserva, sem passar do máximo do imóvel. Visitas dependem de autorização.\n3. Silêncio: respeite a lei de silêncio do município e o regulamento do condomínio (em geral, das 22h às 8h).\n4. Festas e eventos: não são permitidos sem autorização por escrito.\n5. Fumo: proibido fumar dentro do imóvel. Fumar só nas áreas externas permitidas pelo condomínio.\n6. Animais: só com autorização prévia.\n7. Condomínio: siga o regulamento do condomínio (piscina, garagem, áreas comuns, cadastro de hóspedes na portaria).\n8. Conservação: não mude móveis de cômodo nem retire itens do imóvel. Avise logo qualquer defeito ou quebra.\n9. Lixo e limpeza: deixe o lixo ensacado no local indicado. Limpeza fora do normal pode ser descontada da caução.\n10. Chaves e acessos: devolva chaves, controles e cartões no check-out. A perda pode ser cobrada.\n11. Danos e faltas: danos, itens quebrados e faltas apurados na vistoria de saída, comparada com a vistoria de entrada, podem ser descontados da caução. Se passarem do
